# Netlify build settings for the Kakatiya Printing Inks marketing site (Vite).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page site: serve index.html for any unknown path instead of a hard 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
