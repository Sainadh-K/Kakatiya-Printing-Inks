  -->
  <defs>
    <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f51d31" />
      <stop offset="0.16" stop-color="#fb7c00" />
      <stop offset="0.32" stop-color="#f1cb1c" />
      <stop offset="0.48" stop-color="#33b544" />
      <stop offset="0.63" stop-color="#00bbd5" />
      <stop offset="0.78" stop-color="#0766ee" />
      <stop offset="0.9" stop-color="#7d24d3" />
